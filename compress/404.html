<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found — ArtViSiON · Tools</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<style>
  :root{--bg:#F8F4EF;--s1:#FFFCF8;--b1:#EADFD3;--tx:#2F2A26;--t2:#615A53;--t3:#8B8178;--r:#E08D7B;--r-hov:#EB9E8D;--gold:#C8A97E}
  @media (prefers-color-scheme:dark){
    :root{--bg:#262220;--s1:#2E2A27;--b1:#453E39;--tx:#F6F0E9;--t2:#CFC5BA;--t3:#9C9086;--r:#E08D7B;--r-hov:#EB9E8D;--gold:#C8A97E}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);
       font:13px/1.7 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px;text-align:center}
  .box{max-width:460px;background:var(--s1);border:1px solid var(--b1);border-radius:24px;padding:36px 32px;
       box-shadow:0 14px 34px rgba(90,70,50,.09)}
  .k{font-size:8px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:600}
  h1{font-size:34px;letter-spacing:5px;text-transform:uppercase;margin:14px 0 8px}
  h1 span{color:var(--r)}
  p{color:var(--t2);font-size:12px}
  a.btn{display:inline-block;margin-top:22px;padding:11px 24px;border-radius:999px;background:var(--r);
        color:#fff;text-decoration:none;font-weight:700;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;
        box-shadow:0 4px 12px rgba(224,141,123,.26);transition:.18s ease}
  a.btn:hover{background:var(--r-hov);transform:translateY(-1px)}
  a.alt{display:inline-block;margin-top:14px;padding:4px 12px;border-radius:999px;color:var(--t3);
        font-size:10px;letter-spacing:1.2px;text-transform:uppercase;text-decoration:none}
  a.alt:hover{color:var(--tx)}
</style>
</head>
<body>
  <div class="box">
    <div class="k">ArtViSiON · Compress</div>
    <h1>404<span>.</span></h1>
    <p>This page does not exist — but the whole compressor does, and it is one click away.
       Every tool runs locally in your browser.</p>
    <a class="btn" href="./index.html">Open the compressor</a><br>
    <a class="alt" href="./compress/">or go to /compress/</a>
  </div>
  <script>
    // if this page was reached from a deep link inside /compress/, send the user to the app
    if (location.pathname.indexOf('/compress/') === 0) {
      document.querySelector('a.btn').href = './index.html';
    }
  </script>
</body>
</html>
