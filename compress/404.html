<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found — ArtViSiON · Tools</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<style>
  :root{--bg:#373A3E;--s1:#2E3135;--b1:#3F4348;--tx:#F4F0EA;--t2:#B9B6B0;--t3:#8C8A85;--r:#D75A5A;--gold:#BFA873}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);
       font:13px/1.7 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px;text-align:center}
  .box{max-width:460px}
  .k{font-size:8px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
  h1{font-size:34px;letter-spacing:5px;text-transform:uppercase;margin:14px 0 8px}
  h1 span{color:var(--r)}
  p{color:var(--t2);font-size:12px}
  a.btn{display:inline-block;margin-top:22px;padding:11px 22px;border-radius:999px;background:var(--r);
        color:#1e1f21;text-decoration:none;font-weight:700;font-size:10px;letter-spacing:1.6px;text-transform:uppercase}
  a.alt{display:block;margin-top:14px;color:var(--t3);font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
</style>
</head>
<body>
  <div class="box">
    <div class="k">ArtViSiON · Compress</div>
    <h1>404<span>.</span></h1>
    <p>This page does not exist — but the whole compressor does, and it is one click away.
       Every tool runs locally in your browser.</p>
    <a class="btn" href="./index.html">Open the compressor</a>
    <a class="alt" href="./compress/">or go to /compress/</a>
  </div>
  <script>
    // if this page was reached from a deep link inside /compress/, send the user to the app
    if (location.pathname.indexOf('/compress/') === 0) {
      document.querySelector('a.btn').href = './index.html';
    }
  </script>
</body>
</html>
